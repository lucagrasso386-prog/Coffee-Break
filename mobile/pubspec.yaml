name: coffee_break
description: "Coffee Break — a match-3 pâtisserie/café game."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  # Auth providers for the two sign-in options exposed by the backend
  # (backend/src/routes/auth.ts): device-local (no package needed) plus
  # Apple and Google, so both launch platforms get a real account option.
  sign_in_with_apple: ^6.1.3
  google_sign_in: ^6.2.2
  # Push notifications (07-regles-globales-ui.md: must prompt the player to
  # allow notifications, for all game events). Needs a Firebase project
  # (google-services.json / GoogleService-Info.plist) that doesn't exist
  # yet -- see docs/SETUP.md.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates iOS + Android launcher icons from one source image, run
  # manually (see mobile/README.md) — never invents icon pixels itself,
  # just resizes/pads the untouched source per platform.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/game_elements/
    - assets/boosts/
    - assets/currency/
    - assets/special_pieces/
    - assets/obstacles/
    - assets/delivery_objectives/
    - assets/branding/
    - assets/loading_backgrounds/

flutter_launcher_icons:
  image_path: "assets/icon/icon-1024.png"
  android: true
  ios: true
