name: CoffeeBreak
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  CoffeeBreak:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoffeeBreak
    info:
      path: CoffeeBreak/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Coffee Break
    entitlements:
      path: CoffeeBreak/Resources/CoffeeBreak.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        # Replace with the real Bundle ID once it's created in Apple Developer
        # (see docs/SETUP.md). Must stay distinct from the creator's other app.
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.coffeebreak
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Single-size app icon (Xcode 14+): only the 1024 marketing icon is
        # provided in AppIcon.appiconset, Xcode generates the rest at build time.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
