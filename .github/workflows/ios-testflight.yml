name: iOS TestFlight

# Signs and uploads a real build to TestFlight. Needs the GitHub Secrets
# listed in docs/SETUP.md step 3 -- nothing here can create those for you,
# they're tied to your Apple Developer account. Triggered manually (from
# GitHub's Actions tab, or via the GitHub API on your behalf) rather than
# on every push, since each run uses build-minute quota and uploads a real
# TestFlight build.
on:
  workflow_dispatch:
    inputs:
      send:
        description: "Upload to TestFlight after signing (uncheck to just verify signing works)"
        type: boolean
        default: true

jobs:
  build-and-upload:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate the Flutter iOS platform project
        run: flutter create --platforms=ios --org lux --project-name coffee_break .

      - name: Force the exact registered Bundle ID and Development Team
        # `flutter create` on an existing pubspec.yaml keeps its `name:`
        # field ("coffee_break") for the generated project, and Flutter's
        # own org+name-to-bundle-id conversion isn't guaranteed to land on
        # the *exact* string registered in Apple Developer/App Store
        # Connect (lux.coffeebreak) -- so this overwrites it directly
        # rather than relying on that conversion. Also touches the unused
        # RunnerTests target (harmless: it's never archived/uploaded here).
        #
        # Separately, `flutter build ios --no-codesign` still fails on
        # current Xcode with "requires a selected Development Team" unless
        # DEVELOPMENT_TEAM is set somewhere Xcode's new build system reads
        # it -- appending it to the per-configuration xcconfig files (which
        # Flutter always includes) is the standard fix, since automatic
        # signing needs a team even for the codesign-skipped compile step.
        #
        # And separately again: the generated pbxproj pins
        # CODE_SIGN_IDENTITY to the legacy "iPhone Developer" value for
        # every configuration (Flutter's default template). With
        # CODE_SIGN_STYLE = Automatic, Xcode's new build system treats
        # *any* explicit CODE_SIGN_IDENTITY -- "iPhone Developer" (the
        # default) or "Apple Distribution" (an earlier attempt at this
        # fix) alike -- as a manual override that conflicts with letting
        # automatic signing resolve it itself, which is what actually
        # produced "Runner is automatically signed for development, but a
        # conflicting code signing identity ... has been manually
        # specified" both times. Clearing it to an empty string (not
        # deleting the line, and not setting a competing value) is the
        # documented fix: it tells automatic signing there's nothing to
        # override, so -allowProvisioningUpdates can resolve the right
        # (Distribution, for an archive) identity via the ASC API key on
        # its own.
        run: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = lux.coffeebreak;/g" \
            ios/Runner.xcodeproj/project.pbxproj
          sed -i '' -E \
            -e 's/"CODE_SIGN_IDENTITY\[sdk=([a-z*]+)\]" = "[^"]*";/"CODE_SIGN_IDENTITY[sdk=\1]" = "";/g' \
            -e 's/([[:space:]])CODE_SIGN_IDENTITY = "[^"]*";/\1CODE_SIGN_IDENTITY = "";/g' \
            ios/Runner.xcodeproj/project.pbxproj
          for f in ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig ios/Flutter/Profile.xcconfig; do
            echo "DEVELOPMENT_TEAM = 9Q64FWDPM5" >> "$f"
          done

      - name: Install Flutter packages
        run: flutter pub get

      - name: Import the distribution certificate into a temporary keychain
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/ci-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8

      - name: Compile the Flutter assets (no signing yet)
        run: flutter build ios --release --no-codesign

      - name: Archive and export the signed .ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          AUTH_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -sdk iphoneos \
            -configuration Release -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            archive -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist ../ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        if: ${{ inputs.send }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/Runner.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload the .ipa as a workflow artifact
        if: ${{ !inputs.send }}
        uses: actions/upload-artifact@v4
        with:
          name: coffee-break-ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Remove the temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/ci-signing.keychain-db" || true
